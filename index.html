<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content24 AI — 30.8s Cinema Commercial (Matched 1:1 to @zeligsound Reference)</title>
  <style>
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("/fonts/PlusJakartaSans-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("/fonts/SpaceGrotesk-Medium.ttf") format("truetype");
      font-weight: 500;
    }
    @font-face {
      font-family: "Inter";
      src: url("/fonts/Inter-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Inter";
      src: url("/fonts/Inter-SemiBold.ttf") format("truetype");
      font-weight: 600;
    }

    :root {
      --bg: #050508;
      --surface: #10101b;
      --surface-2: #181829;
      --border: rgba(255, 255, 255, 0.12);
      --border-hi: rgba(168, 85, 247, 0.65);
      --text: #f8f8fc;
      --muted: #9ca1be;
      --grad: linear-gradient(135deg, #8b3dff 0%, #ec4899 52%, #f97316 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 22% -8%, rgba(139, 61, 255, 0.18), transparent 44%),
                  radial-gradient(circle at 78% -8%, rgba(249, 115, 22, 0.14), transparent 44%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 8, 16, 0.92);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { height: 24px; width: auto; display: block; }
    .live-pill {
      font-family: "Space Grotesk", sans-serif;
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #86efac;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.4);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .mode-tabs {
      display: flex;
      background: var(--surface);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 3px;
    }
    .mode-tab {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
    }
    .mode-tab.active {
      background: var(--surface-2);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(168, 85, 247, 0.55);
    }

    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .btn-primary {
      background: var(--grad);
      border: none;
      color: #fff;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
    }

    .main-stage {
      flex: 1;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .player-shell {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.38);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video.hero-video {
      width: 100%;
      max-height: 62vh;
      display: block;
      background: #000;
    }
    video.hero-video.vertical-mode {
      width: auto;
      height: 64vh;
      max-width: 100%;
    }

    .unmute-floating {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(10, 10, 20, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(249, 115, 22, 0.7);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .unmute-floating.unmuted {
      border-color: rgba(74, 222, 128, 0.6);
      color: #bbf7d0;
    }

    .compare-grid {
      display: none;
      width: 100%;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      background: #06060b;
    }
    .compare-grid.active { display: grid; }
    @media (max-width: 760px) { .compare-grid.active { grid-template-columns: 1fr; } }
    .compare-pane {
      background: #0c0c16;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .compare-head {
      padding: 8px 12px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .compare-pane video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000;
    }

    .acts-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 9px;
    }
    @media (max-width: 900px) {
      .acts-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .act-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
    }
    .act-card:hover, .act-card.current { border-color: var(--border-hi); }
    .act-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .act-meta { padding: 7px 9px; }
    .act-time {
      font-family: "Space Grotesk", sans-serif;
      font-size: 10px;
      color: #f472b6;
    }
    .act-name {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/media/c24-logo-light.png" alt="Content24 AI" />
      <span class="live-pill">● Matched 1:1 to @zeligsound Reference</span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="16:9">16:9 Cinema Commercial</button>
      <button class="mode-tab" data-mode="compare">1:1 Synced Side-by-Side w/ Your Reference</button>
      <button class="mode-tab" data-mode="9:16">9:16 Vertical Cut</button>
    </div>

    <div class="actions">
      <a class="btn" href="/download/9x16">⬇ Download 9:16 MP4</a>
      <a class="btn btn-primary" href="/download/16x9">⬇ Download 16:9 HD MP4</a>
    </div>
  </header>

  <main class="main-stage">
    <div class="player-shell">
      <button class="unmute-floating" id="unmuteBtn">🔇 Playing Muted — Click to Enable @zeligsound Audio</button>

      <video
        id="adVideo"
        class="hero-video"
        src="/videos/content24-ad-16x9.mp4"
        autoplay
        muted
        loop
        playsinline
        controls
      ></video>

      <div class="compare-grid" id="compareGrid">
        <div class="compare-pane">
          <div class="compare-head">
            <span>Your Uploaded Reference (@zeligsound · 30.8s)</span>
          </div>
          <video
            id="refVideo"
            src="/videos/reference-source.mp4"
            autoplay
            muted
            loop
            playsinline
            controls
          ></video>
        </div>
        <div class="compare-pane">
          <div class="compare-head">
            <span style="color:#f9a8d4;">New Content24 AI Hub Commercial (1080p · 30.8s)</span>
            <a href="https://app.content24.ai/" target="_blank" rel="noreferrer" style="color:#fdba74;text-decoration:none;">app.content24.ai ↗</a>
          </div>
          <video
            id="cmpC24Video"
            src="/videos/content24-ad-16x9.mp4"
            autoplay
            muted
            loop
            playsinline
            controls
          ></video>
        </div>
      </div>
    </div>

    <div class="acts-grid">
      <button class="act-card current" data-time="1.5">
        <img class="act-thumb" src="/frames/frame_01_eye.jpg" alt="Eye Awakening" />
        <div class="act-meta">
          <div class="act-time">00:00 – 00:09</div>
          <div class="act-name">01 · Eye Portal &amp; Silk Stream</div>
        </div>
      </button>
      <button class="act-card" data-time="9.5">
        <img class="act-thumb" src="/frames/frame_03_ribbons.jpg" alt="AI Convergence" />
        <div class="act-meta">
          <div class="act-time">00:09 – 00:13.5</div>
          <div class="act-name">02 · AI Models Converge</div>
        </div>
      </button>
      <button class="act-card" data-time="15.3">
        <img class="act-thumb" src="/frames/v3_vortex.jpg" alt="Vortex & Iris" />
        <div class="act-meta">
          <div class="act-time">00:13.5 – 00:18.6</div>
          <div class="act-name">03 · Vortex &amp; Iris Match-Cut</div>
        </div>
      </button>
      <button class="act-card" data-time="20.2">
        <img class="act-thumb" src="/frames/v3_macro_glass.jpg" alt="Macro Glass" />
        <div class="act-meta">
          <div class="act-time">00:18.6 – 00:24.2</div>
          <div class="act-name">04 · Silk &amp; Glass Unveil</div>
        </div>
      </button>
      <button class="act-card" data-time="24.4">
        <img class="act-thumb" src="/frames/frame_05_hub.jpg" alt="Content24 Hub" />
        <div class="act-meta">
          <div class="act-time">00:24.2 – 00:28.3</div>
          <div class="act-name">05 · Content24 AI Hub Reveal</div>
        </div>
      </button>
      <button class="act-card" data-time="28.5">
        <img class="act-thumb" src="/frames/frame_06_endcard.jpg" alt="End Card" />
        <div class="act-meta">
          <div class="act-time">00:28.3 – 00:30.8</div>
          <div class="act-name">06 · Luxury Black End Cards</div>
        </div>
      </button>
    </div>
  </main>

  <script>
    const adVideo = document.getElementById("adVideo");
    const refVideo = document.getElementById("refVideo");
    const cmpC24Video = document.getElementById("cmpC24Video");
    const compareGrid = document.getElementById("compareGrid");
    const unmuteBtn = document.getElementById("unmuteBtn");
    const modeTabs = document.querySelectorAll(".mode-tab");
    const actCards = document.querySelectorAll(".act-card");

    let currentMode = "16:9";
    adVideo.play().catch(() => {});

    unmuteBtn.addEventListener("click", () => {
      const target = currentMode === "compare" ? cmpC24Video : adVideo;
      const nowMuted = !target.muted;
      adVideo.muted = nowMuted;
      cmpC24Video.muted = nowMuted;
      refVideo.muted = true; // Prevent double audio echo during side-by-side sync
      target.play().catch(() => {});
      if (!nowMuted) {
        unmuteBtn.textContent = "🔊 @zeligsound Audio Active (Click to Mute)";
        unmuteBtn.classList.add("unmuted");
      } else {
        unmuteBtn.textContent = "🔇 Playing Muted — Click to Enable @zeligsound Audio";
        unmuteBtn.classList.remove("unmuted");
      }
    });

    function activeVideo() {
      return currentMode === "compare" ? cmpC24Video : adVideo;
    }

    function updateCards() {
      const t = activeVideo().currentTime || 0;
      let idx = 0;
      if (t >= 28.3) idx = 5;
      else if (t >= 24.2) idx = 4;
      else if (t >= 18.6) idx = 3;
      else if (t >= 13.5) idx = 2;
      else if (t >= 9.4) idx = 1;
      actCards.forEach((c, i) => c.classList.toggle("current", i === idx));
    }

    adVideo.addEventListener("timeupdate", updateCards);
    cmpC24Video.addEventListener("timeupdate", updateCards);

    actCards.forEach((card) => {
      card.addEventListener("click", () => {
        const t = parseFloat(card.dataset.time);
        const v = activeVideo();
        v.currentTime = t;
        v.play().catch(() => {});
        if (currentMode === "compare") {
          refVideo.currentTime = t;
          refVideo.play().catch(() => {});
        }
      });
    });

    modeTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const prevT = activeVideo().currentTime || 0;
        modeTabs.forEach((b) => b.classList.remove("active"));
        tab.classList.add("active");
        currentMode = tab.dataset.mode;

        if (currentMode === "compare") {
          adVideo.pause();
          adVideo.style.display = "none";
          compareGrid.classList.add("active");
          cmpC24Video.currentTime = prevT;
          refVideo.currentTime = prevT;
          cmpC24Video.play().catch(() => {});
          refVideo.play().catch(() => {});
        } else {
          cmpC24Video.pause();
          refVideo.pause();
          compareGrid.classList.remove("active");
          adVideo.style.display = "block";
          const vert = currentMode === "9:16";
          adVideo.classList.toggle("vertical-mode", vert);
          adVideo.src = vert ? "/videos/content24-ad-9x16.mp4" : "/videos/content24-ad-16x9.mp4";
          adVideo.currentTime = prevT;
          adVideo.play().catch(() => {});
        }
      });
    });
  </script>
</body>
</html>
