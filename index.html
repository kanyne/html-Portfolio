<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content24 AI — 30s Commercial Video Player</title>
  <style>
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("/fonts/PlusJakartaSans-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("/fonts/PlusJakartaSans-ExtraBold.ttf") format("truetype");
      font-weight: 800;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("/fonts/SpaceGrotesk-Medium.ttf") format("truetype");
      font-weight: 500;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("/fonts/SpaceGrotesk-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Inter";
      src: url("/fonts/Inter-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Inter";
      src: url("/fonts/Inter-SemiBold.ttf") format("truetype");
      font-weight: 600;
    }

    :root {
      --bg: #06060b;
      --surface: #11111e;
      --surface-2: #19192c;
      --border: rgba(255, 255, 255, 0.11);
      --border-hi: rgba(168, 85, 247, 0.55);
      --text: #f8f8fc;
      --muted: #9ca1be;
      --purple: #a855f7;
      --grad: linear-gradient(135deg, #8b3dff 0%, #ec4899 52%, #f97316 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% -8%, rgba(139, 61, 255, 0.18), transparent 44%),
                  radial-gradient(circle at 80% -8%, rgba(249, 115, 22, 0.14), transparent 44%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 20, 0.9);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img { height: 24px; width: auto; display: block; }
    .live-pill {
      font-family: "Space Grotesk", sans-serif;
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #86efac;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(74, 222, 128, 0.35);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .mode-tabs {
      display: flex;
      background: var(--surface);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 3px;
    }
    .mode-tab {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: "Inter", sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
    }
    .mode-tab.active {
      background: var(--surface-2);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(168, 85, 247, 0.5);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .btn:hover { border-color: rgba(255, 255, 255, 0.35); }
    .btn-primary {
      background: var(--grad);
      border: none;
      color: #fff;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
    }

    .main-stage {
      flex: 1;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .player-shell {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 20px 65px rgba(0, 0, 0, 0.7), 0 0 45px rgba(168, 85, 247, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video.hero-video {
      width: 100%;
      max-height: 60vh;
      display: block;
      background: #000;
    }
    video.hero-video.vertical-mode {
      width: auto;
      height: 62vh;
      max-width: 100%;
    }

    .unmute-floating {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: rgba(12, 12, 24, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(249, 115, 22, 0.65);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .unmute-floating.unmuted {
      border-color: rgba(74, 222, 128, 0.55);
      color: #bbf7d0;
    }

    .compare-grid {
      display: none;
      width: 100%;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      background: #07070e;
    }
    .compare-grid.active { display: grid; }
    @media (max-width: 760px) { .compare-grid.active { grid-template-columns: 1fr; } }
    .compare-pane {
      background: #0d0d18;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .compare-head {
      padding: 8px 12px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .compare-pane video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000;
    }

    /* 5-Act Scene Jump Strip */
    .acts-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 820px) {
      .acts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .act-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .act-card:hover, .act-card.current {
      border-color: var(--border-hi);
      transform: translateY(-2px);
    }
    .act-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .act-meta { padding: 8px 10px; }
    .act-time {
      font-family: "Space Grotesk", sans-serif;
      font-size: 10px;
      color: #f472b6;
      letter-spacing: 0.06em;
    }
    .act-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
    }

    /* Collapsible Custom Copy Editor Drawer */
    .drawer {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      gap: 12px;
    }
    .drawer.open {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-family: "Space Grotesk", sans-serif;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #c4b5fd;
    }
    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 12.5px;
    }
    .status-banner {
      grid-column: 1 / -1;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(168, 85, 247, 0.14);
      border: 1px solid rgba(168, 85, 247, 0.35);
      font-size: 12px;
      color: #f3e8ff;
      display: none;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/media/c24-logo-light.png" alt="Content24 AI" />
      <span class="live-pill">● 30s Commercial Playing</span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="16:9">16:9 Widescreen Video</button>
      <button class="mode-tab" data-mode="9:16">9:16 Vertical Video</button>
      <button class="mode-tab" data-mode="compare">Compare w/ Reference Pin</button>
    </div>

    <div class="actions">
      <button class="btn" id="toggleEditBtn">✎ Edit Copy / Re-Render</button>
      <a class="btn" href="/download/9x16">⬇ Download 9:16 MP4</a>
      <a class="btn btn-primary" href="/download/16x9">⬇ Download 16:9 HD MP4</a>
    </div>
  </header>

  <main class="main-stage">
    <div class="player-shell">
      <button class="unmute-floating" id="unmuteBtn">🔇 Playing Muted — Click for Zelig Soundtrack</button>

      <video
        id="adVideo"
        class="hero-video"
        src="/videos/content24-ad-16x9.mp4"
        autoplay
        muted
        loop
        playsinline
        controls
      ></video>

      <div class="compare-grid" id="compareGrid">
        <div class="compare-pane">
          <div class="compare-head">
            <span>Reference Pin · FutureDeluxe × Zelig (30s)</span>
            <a href="https://www.pinterest.com/pin/7599893117933071/" target="_blank" rel="noreferrer" style="color:#c4b5fd;text-decoration:none;">Pinterest ↗</a>
          </div>
          <video
            id="refVideo"
            src="https://v1.pinimg.com/videos/iht/expMp4/b9/02/27/b9022756cfc2e411145c395d7ca2ebd5_720w.mp4"
            autoplay
            muted
            loop
            playsinline
            controls
          ></video>
        </div>
        <div class="compare-pane">
          <div class="compare-head">
            <span style="color:#f9a8d4;">Your Video Ad · Content24 AI Hub (30s)</span>
            <a href="https://app.content24.ai/" target="_blank" rel="noreferrer" style="color:#fdba74;text-decoration:none;">app.content24.ai ↗</a>
          </div>
          <video
            id="cmpC24Video"
            src="/videos/content24-ad-16x9.mp4"
            autoplay
            muted
            loop
            playsinline
            controls
          ></video>
        </div>
      </div>
    </div>

    <div class="acts-grid" id="actsGrid">
      <button class="act-card current" data-time="0.0">
        <img class="act-thumb" src="/frames/frame_01_eye.jpg" alt="Act 1" />
        <div class="act-meta">
          <div class="act-time">00:00 – 00:06</div>
          <div class="act-name">01 · Eye Portal Awakening</div>
        </div>
      </button>
      <button class="act-card" data-time="6.3">
        <img class="act-thumb" src="/frames/frame_03_ribbons.jpg" alt="Act 2" />
        <div class="act-meta">
          <div class="act-time">00:06 – 00:13</div>
          <div class="act-name">02 · Multimodal Silk Worlds</div>
        </div>
      </button>
      <button class="act-card" data-time="13.4">
        <img class="act-thumb" src="/frames/frame_04_prism.jpg" alt="Act 3" />
        <div class="act-meta">
          <div class="act-time">00:13 – 00:20</div>
          <div class="act-name">03 · All AI Models Converge</div>
        </div>
      </button>
      <button class="act-card" data-time="20.6">
        <img class="act-thumb" src="/frames/frame_05_hub.jpg" alt="Act 4" />
        <div class="act-meta">
          <div class="act-time">00:20 – 00:27</div>
          <div class="act-name">04 · Content24 Hub Reveal</div>
        </div>
      </button>
      <button class="act-card" data-time="26.9">
        <img class="act-thumb" src="/frames/frame_06_endcard.jpg" alt="Act 5" />
        <div class="act-meta">
          <div class="act-time">00:27 – 00:30</div>
          <div class="act-name">05 · Platinum End Card</div>
        </div>
      </button>
    </div>

    <section class="drawer" id="editDrawer">
      <div class="field">
        <label>Act I · Hook Headline</label>
        <input id="f_act1_title" value="Every great idea starts with a vision." />
      </div>
      <div class="field">
        <label>Act I · Subtitle</label>
        <input id="f_act1_sub" value="Why scatter yours across a dozen AI tools?" />
      </div>
      <div class="field">
        <label>Act II · Multimodal Headline</label>
        <input id="f_act2_title" value="Write. Design. Film. Automate." />
      </div>
      <div class="field">
        <label>Act III · Convergence Line 1</label>
        <input id="f_act3_title_1" value="Every flagship AI." />
      </div>
      <div class="field">
        <label>Act III · Convergence Line 2</label>
        <input id="f_act3_title_2" value="One unified hub." />
      </div>
      <div class="field">
        <label>Act IV · Hub Reveal Headline</label>
        <input id="f_act4_title" value="Meet Content24 AI" />
      </div>
      <div class="field">
        <label>Act V · End Tagline</label>
        <input id="f_act5_tagline" value="EVERYTHING AI.  ONE HUB." />
      </div>
      <div class="field">
        <label>Act V · CTA URL</label>
        <input id="f_act5_cta" value="app.content24.ai" />
      </div>
      <div style="grid-column: 1 / -1; display:flex; justify-content:flex-end;">
        <button class="btn btn-primary" id="rerenderBtn" style="padding:10px 20px;">⚡ Re-Render 1080p MP4s on Server</button>
      </div>
      <div class="status-banner" id="statusBox"></div>
    </section>
  </main>

  <script>
    const adVideo = document.getElementById("adVideo");
    const refVideo = document.getElementById("refVideo");
    const cmpC24Video = document.getElementById("cmpC24Video");
    const compareGrid = document.getElementById("compareGrid");
    const unmuteBtn = document.getElementById("unmuteBtn");
    const modeTabs = document.querySelectorAll(".mode-tab");
    const actCards = document.querySelectorAll(".act-card");
    const toggleEditBtn = document.getElementById("toggleEditBtn");
    const editDrawer = document.getElementById("editDrawer");

    let currentMode = "16:9";
    let cacheBust = "";

    adVideo.play().catch(() => {});

    unmuteBtn.addEventListener("click", () => {
      const target = currentMode === "compare" ? cmpC24Video : adVideo;
      const nowMuted = !target.muted;
      adVideo.muted = nowMuted;
      cmpC24Video.muted = nowMuted;
      target.play().catch(() => {});
      if (!nowMuted) {
        unmuteBtn.textContent = "🔊 Zelig Soundtrack Active (Click to Mute)";
        unmuteBtn.classList.add("unmuted");
      } else {
        unmuteBtn.textContent = "🔇 Playing Muted — Click for Zelig Soundtrack";
        unmuteBtn.classList.remove("unmuted");
      }
    });

    function activeVideo() {
      return currentMode === "compare" ? cmpC24Video : adVideo;
    }

    function updateHighlight() {
      const t = activeVideo().currentTime || 0;
      let idx = 0;
      if (t >= 26.8) idx = 4;
      else if (t >= 20.4) idx = 3;
      else if (t >= 13.2) idx = 2;
      else if (t >= 6.2) idx = 1;
      actCards.forEach((c, i) => c.classList.toggle("current", i === idx));
    }

    adVideo.addEventListener("timeupdate", updateHighlight);
    cmpC24Video.addEventListener("timeupdate", updateHighlight);

    actCards.forEach((card) => {
      card.addEventListener("click", () => {
        const t = parseFloat(card.dataset.time);
        const v = activeVideo();
        v.currentTime = t;
        v.play().catch(() => {});
        if (currentMode === "compare") {
          refVideo.currentTime = t;
          refVideo.play().catch(() => {});
        }
      });
    });

    modeTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const prevT = activeVideo().currentTime || 0;
        modeTabs.forEach((b) => b.classList.remove("active"));
        tab.classList.add("active");
        currentMode = tab.dataset.mode;

        if (currentMode === "compare") {
          adVideo.pause();
          adVideo.style.display = "none";
          compareGrid.classList.add("active");
          cmpC24Video.currentTime = prevT;
          refVideo.currentTime = prevT;
          cmpC24Video.play().catch(() => {});
          refVideo.play().catch(() => {});
        } else {
          cmpC24Video.pause();
          refVideo.pause();
          compareGrid.classList.remove("active");
          adVideo.style.display = "block";
          const vert = currentMode === "9:16";
          adVideo.classList.toggle("vertical-mode", vert);
          adVideo.src = (vert ? "/videos/content24-ad-9x16.mp4" : "/videos/content24-ad-16x9.mp4") + cacheBust;
          adVideo.currentTime = prevT;
          adVideo.play().catch(() => {});
        }
      });
    });

    toggleEditBtn.addEventListener("click", () => {
      editDrawer.classList.toggle("open");
      if (editDrawer.classList.contains("open")) {
        editDrawer.scrollIntoView({ behavior: "smooth" });
      }
    });

    const rerenderBtn = document.getElementById("rerenderBtn");
    const statusBox = document.getElementById("statusBox");

    rerenderBtn.addEventListener("click", async () => {
      const copy = {
        act1_title: document.getElementById("f_act1_title").value,
        act1_sub: document.getElementById("f_act1_sub").value,
        act2_title: document.getElementById("f_act2_title").value,
        act3_title_1: document.getElementById("f_act3_title_1").value,
        act3_title_2: document.getElementById("f_act3_title_2").value,
        act4_title: document.getElementById("f_act4_title").value,
        act5_tagline: document.getElementById("f_act5_tagline").value,
        act5_cta: document.getElementById("f_act5_cta").value,
      };
      rerenderBtn.disabled = true;
      statusBox.style.display = "block";
      statusBox.textContent = "Rendering updated 1080p MP4s on server...";

      try {
        const res = await fetch("/api/render", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ copy, format: "both" }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Render failed");

        const poll = setInterval(async () => {
          const st = await (await fetch("/api/status")).json();
          statusBox.textContent = st.renderStatus.message;
          if (!st.renderInProgress) {
            clearInterval(poll);
            rerenderBtn.disabled = false;
            if (st.renderStatus.state === "done") {
              cacheBust = "?t=" + Date.now();
              adVideo.src = (currentMode === "9:16" ? "/videos/content24-ad-9x16.mp4" : "/videos/content24-ad-16x9.mp4") + cacheBust;
              cmpC24Video.src = "/videos/content24-ad-16x9.mp4" + cacheBust;
              adVideo.play().catch(() => {});
            }
          }
        }, 1800);
      } catch (e) {
        statusBox.textContent = "Error: " + e.message;
        rerenderBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
